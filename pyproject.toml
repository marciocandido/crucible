[project]
name = "crucible"
version = "0.1.0"
description = "A CLI that runs a turn-based technical debate between AI agents about an idea, with a human in the loop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
crucible = "crucible.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
